[package]
name = "bsdiff-wasm"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
qbsdiff = "=1.4.4"

[profile.release]
codegen-units = 1
lto = true
strip = true

# suffix_array's `cdivsufsort` compiles C, which needs a C toolchain for WebAssembly.
[patch.crates-io]
cdivsufsort = { path = "patches/cdivsufsort" }
